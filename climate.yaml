#### change log ####
# 07.2026 : cooling support - presets extended to HEAT_COOL with
#           default_target_temperature_high; dummy cool_action added
#           (real action is triggered by the interval checks, same as heat).
#           Season (Heat/Cool) selects the position formula in
#           script_termostat_check.yaml; a channel is excluded from
#           heating AND cooling by switching its climate entity to OFF
#           (e.g. kupelna in summer).
# 09.2026 : REVERTED - on_state -> script.execute was added and then
#           pulled after it caused sustained open/close hunting in the
#           field. ESPHome's thermostat component calls publish_state()
#           on every temperature sensor reading (not just mode changes),
#           so on_state fired far more often than the ~30s a valve needs
#           to complete a move. Re-entrant calls landing right as a valve
#           reached position 0 hit a tie-break in EndstopCover::control()
#           (pos < this->position ? CLOSING : OPENING - defaults to
#           OPENING when equal) that isn't guarded against the idempotency
#           check in start_direction_(), so it would briefly reopen, then
#           get corrected closed by the next re-entrant call, indefinitely.
#           Back to interval/manual-trigger only (see time.yaml /
#           switch_others.yaml) - the ~30s move always completes between
#           triggers there, so this condition can't be reached.
# 19.10.2022 : https://github.com/esphome/esphome/pull/3643
# 11.11.2021 : remove away_config (temperature do not survive reboot : https://github.com/esphome/issues/issues/2680#issuecomment-966863690

climate:
  - platform: thermostat
    id: ${ch1_thermostat_name}_thermostat
    name: ${ch1_thermostat_name}
    sensor: ${ch1_thermostat_sensor}
    default_preset: default
    on_boot_restore_from: memory
    startup_delay: true
    preset:
      - name: default
        default_target_temperature_low: ${ch1_default_target_temperature_low}
        default_target_temperature_high: ${ch1_default_target_temperature_high}
        mode: HEAT_COOL
    min_heating_off_time: 300s
    min_heating_run_time: 300s
    min_cooling_off_time: 300s
    min_cooling_run_time: 300s
    min_idle_time: 30s
    heat_deadband: 0 °C
    heat_overrun: 0.2 °C
    cool_deadband: 0 °C
    cool_overrun: 0.2 °C
    heat_action:
         - lambda: 'return;' # do nothing cause action is triggered by time interval
    cool_action:
         - lambda: 'return;' # do nothing cause action is triggered by time interval
    idle_action:
         - lambda: 'return;'
    visual:
      min_temperature: 10 °C
      max_temperature: 30 °C
      temperature_step: 0.1 °C

